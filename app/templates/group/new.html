{% extends "base.html" %}
{% block title %}New Group — Rup-Split{% endblock %}
{% block content %}
<div class="card bg-base-100 shadow-md">
    <div class="card-body">
        <h2 class="card-title text-2xl mb-4">Create Group</h2>
        <form method="POST" action="/groups/new">
            <div class="form-control mb-3">
                <label class="label"><span class="label-text">Group Name</span></label>
                <input type="text" name="name" class="input input-bordered" placeholder="e.g., Trip to Goa" required>
            </div>
            <div class="form-control mb-4">
                <label class="label"><span class="label-text">Type</span></label>
                <select name="group_type" class="select select-bordered">
                    <option value="trip">Trip</option>
                    <option value="home">Home</option>
                    <option value="couple">Couple</option>
                    <option value="other" selected>Other</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Create Group</button>
        </form>
    </div>
</div>
{% endblock %}
