{% extends "base.html" %}
{% block title %}Add Expense — {{ group.name }}{% endblock %}
{% block content %}
<div class="card bg-base-100 shadow-md">
    <div class="card-body">
        <h2 class="card-title text-2xl mb-4">Add Expense</h2>
        <form method="POST" action="/expenses/new/{{ group.id }}">
            <div class="form-control mb-3">
                <label class="label"><span class="label-text">Description</span></label>
                <input type="text" name="description" class="input input-bordered" placeholder="e.g., Dinner" required>
            </div>
            <div class="form-control mb-3">
                <label class="label"><span class="label-text">Amount (₹)</span></label>
                <input type="number" name="amount" step="0.01" min="0.01" class="input input-bordered" required>
            </div>
            <div class="form-control mb-3">
                <label class="label"><span class="label-text">Paid by</span></label>
                <select name="paid_by" class="select select-bordered">
                    {% for m in members %}
                    <option value="{{ m.id }}" {% if m.id == user.id %}selected{% endif %}>{{ m.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-control mb-3">
                <label class="label"><span class="label-text">Split type</span></label>
                <select name="split_type" class="select select-bordered" id="split-type"
                        onchange="document.getElementById('exact-fields').style.display = this.value !== 'equal' ? 'block' : 'none'">
                    <option value="equal">Equal</option>
                    <option value="exact">Exact amounts</option>
                    <option value="percent">Percentage</option>
                </select>
            </div>
            <div class="form-control mb-3">
                <label class="label"><span class="label-text">Split with</span></label>
                {% for m in members %}
                <label class="flex items-center gap-2 py-1">
                    <input type="checkbox" name="split_with" value="{{ m.id }}" class="checkbox checkbox-sm" checked>
                    <span class="text-sm">{{ m.name }}</span>
                </label>
                {% endfor %}
            </div>
            <div id="exact-fields" style="display:none" class="mb-3">
                <label class="label"><span class="label-text">Per-person amounts</span></label>
                {% for m in members %}
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-sm w-24">{{ m.name }}</span>
                    <input type="number" name="amount_{{ m.id }}" step="0.01" min="0" class="input input-bordered input-sm flex-1" placeholder="0">
                </div>
                {% endfor %}
            </div>
            <div class="form-control mb-4">
                <label class="label"><span class="label-text">Category</span></label>
                <select name="category" class="select select-bordered select-sm">
                    <option value="">None</option>
                    <option value="food">Food</option>
                    <option value="transport">Transport</option>
                    <option value="accommodation">Accommodation</option>
                    <option value="shopping">Shopping</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="utilities">Utilities</option>
                    <option value="rent">Rent</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Add Expense</button>
        </form>
        <a href="/groups/{{ group.id }}" class="btn btn-ghost btn-block mt-2">Cancel</a>
    </div>
</div>
{% endblock %}
