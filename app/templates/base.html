<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rup-Split{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwindcss.config = {
        daisyui: {
            themes: ["light"],
        },
        theme: {
            extend: {
                colors: {
                    'money': {
                        50: '#f0faf0',
                        100: '#d4f0d4',
                        200: '#a8dba8',
                        600: '#2d6a2d',
                        700: '#1b5e20',
                        800: '#14451a',
                        900: '#0d2e11',
                    }
                }
            }
        }
    }
    </script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="min-h-screen" style="background: #09090B; color: #FAFAFA;">
    <div class="navbar" style="background: #18181B; border-bottom: 1px solid #27272A;">
        <div class="flex-1">
            <a href="/" class="btn btn-ghost text-xl" style="color: #818CF8;">💰 Rup-Split</a>
        </div>
        <div class="flex-none">
            {% if user %}
                <a href="/" class="btn btn-ghost btn-sm" style="color: #A1A1AA;">Home</a>
                <a href="/friends" class="btn btn-ghost btn-sm" style="color: #A1A1AA;">Friends</a>
                <span class="mr-4 text-sm" style="color: #818CF8;">{{ user.name }}</span>
                <a href="/auth/logout" class="btn btn-ghost btn-sm" style="color: #71717A;">Logout</a>
            {% else %}
                <a href="/auth/login" class="btn btn-ghost btn-sm" style="color: #A1A1AA;">Login</a>
            {% endif %}
        </div>
    </div>
    <main class="container mx-auto px-4 py-6 max-w-lg" style="color: #FAFAFA;">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
