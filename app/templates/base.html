<!DOCTYPE html>
<html lang="en" data-theme="light" data-theme-color="{{ user.theme_color or 'copper' if user else 'copper' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Frenmo{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            fontFamily: {
                sans: ['Inter', 'system-ui', 'sans-serif'],
            },
        }
    }
    </script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#C07A45">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <script>
    // Restore theme preferences before paint
    (function() {
        var t = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
        var tc = localStorage.getItem('theme_color');
        if (tc) document.documentElement.setAttribute('data-theme-color', tc);
    })();
    function toggleTheme() {
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        document.getElementById('theme-icon').textContent = next === 'dark' ? '☀️' : '🌙';
    }
    </script>
</head>
<body class="min-h-screen font-sans" style="background: var(--bg-page); color: var(--text-primary); -webkit-font-smoothing: antialiased;">
    <div class="navbar px-6" style="background: var(--navbar-bg); border-bottom: 1px solid var(--navbar-border); min-height: 52px;">
        <div class="flex-1">
            <a href="/" class="text-2xl font-extrabold" style="text-decoration: none; letter-spacing: -0.03em;"><span>💰</span><span style="color: var(--accent);"> Frenmo</span></a>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleTheme()" class="theme-toggle" title="Toggle dark mode">
                <span id="theme-icon">🌙</span>
            </button>
            {% if user %}
                <a href="/" class="text-sm font-medium px-3 py-1.5 rounded-full" style="color: var(--text-secondary); text-decoration: none;">Home</a>
                <a href="/friends" class="text-sm font-medium px-3 py-1.5 rounded-full" style="color: var(--text-secondary); text-decoration: none;">Friends</a>
                <a href="/account" style="text-decoration: none;">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold" style="background: linear-gradient(135deg, var(--accent), var(--accent)); cursor: pointer;">
                        {{ user.name[0]|upper }}
                    </div>
                </a>
                <a href="/auth/logout" class="text-sm px-2 py-1" style="color: var(--text-muted); text-decoration: none;">Logout</a>
            {% else %}
                <a href="/auth/login" class="text-sm font-medium px-3 py-1.5" style="color: var(--text-secondary); text-decoration: none;">Sign In</a>
                <a href="/auth/register" class="btn btn-primary btn-sm">Get Started</a>
            {% endif %}
        </div>
    </div>
    <main class="container mx-auto px-4 py-8 max-w-xl" style="color: var(--text-primary);">
        {% block content %}{% endblock %}
    </main>
    <script>
    // Set correct icon on page load
    document.getElementById('theme-icon').textContent = (localStorage.getItem('theme') === 'dark') ? '☀️' : '🌙';
    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js').catch(function() {});
    }
    // Keep server alive — ping /health every 5 min to prevent idle spindown
    setInterval(function() { fetch('/health').catch(function() {}); }, 5 * 60 * 1000);
    </script>
</body>
</html>
