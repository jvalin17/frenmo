<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Frenmo{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwindcss.config = {
        theme: {
            fontFamily: {
                sans: ['Inter', 'system-ui', 'sans-serif'],
            },
        }
    }
    </script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="min-h-screen font-sans" style="background: #FBFBFD; color: #1D1D1F; -webkit-font-smoothing: antialiased;">
    <div class="navbar px-6" style="background: rgba(251,251,253,0.92); border-bottom: 1px solid #E5E5EA; min-height: 52px;">
        <div class="flex-1">
            <a href="/" class="text-2xl font-extrabold" style="text-decoration: none; letter-spacing: -0.03em;"><span>💰</span><span style="background: linear-gradient(135deg, #3C3B6E 0%, #B0C4DE 50%, #B22234 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;"> Frenmo</span></a>
        </div>
        <div class="flex items-center gap-2">
            {% if user %}
                <a href="/" class="text-sm font-medium px-3 py-1.5 rounded-full" style="color: #6E6E73; text-decoration: none;">Home</a>
                <a href="/friends" class="text-sm font-medium px-3 py-1.5 rounded-full" style="color: #6E6E73; text-decoration: none;">Friends</a>
                <a href="/account" style="text-decoration: none;">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold" style="background: linear-gradient(135deg, #007AFF, #5856D6); cursor: pointer;">
                        {{ user.name[0]|upper }}
                    </div>
                </a>
                <a href="/auth/logout" class="text-sm px-2 py-1" style="color: #AEAEB2; text-decoration: none;">Logout</a>
            {% else %}
                <a href="/auth/login" class="text-sm font-medium px-3 py-1.5" style="color: #6E6E73; text-decoration: none;">Sign In</a>
                <a href="/auth/register" class="btn btn-primary btn-sm">Get Started</a>
            {% endif %}
        </div>
    </div>
    <main class="container mx-auto px-4 py-8 max-w-xl" style="color: #1D1D1F;">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
