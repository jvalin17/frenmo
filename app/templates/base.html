<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rup-Split{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="min-h-screen bg-base-200">
    <div class="navbar bg-base-100 shadow-sm">
        <div class="flex-1">
            <a href="/" class="btn btn-ghost text-xl">Rup-Split</a>
        </div>
        <div class="flex-none">
            {% if user %}
                <span class="mr-4 text-sm">{{ user.name }}</span>
                <a href="/auth/logout" class="btn btn-ghost btn-sm">Logout</a>
            {% else %}
                <a href="/auth/login" class="btn btn-ghost btn-sm">Login</a>
            {% endif %}
        </div>
    </div>
    <main class="container mx-auto px-4 py-6 max-w-lg">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
