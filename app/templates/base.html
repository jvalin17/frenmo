<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rup-Split{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwindcss.config = {
        daisyui: {
            themes: ["light"],
        },
        theme: {
            extend: {
                colors: {
                    'money': {
                        50: '#f0faf0',
                        100: '#d4f0d4',
                        200: '#a8dba8',
                        600: '#2d6a2d',
                        700: '#1b5e20',
                        800: '#14451a',
                        900: '#0d2e11',
                    }
                }
            }
        }
    }
    </script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="min-h-screen" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);">
    <div class="navbar shadow-lg" style="background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.1);">
        <div class="flex-1">
            <a href="/" class="btn btn-ghost text-xl text-emerald-400 hover:text-emerald-300">💰 Rup-Split</a>
        </div>
        <div class="flex-none">
            {% if user %}
                <a href="/" class="btn btn-ghost btn-sm text-gray-300 hover:text-emerald-400">Home</a>
                <a href="/friends" class="btn btn-ghost btn-sm text-gray-300 hover:text-emerald-400">Friends</a>
                <span class="mr-4 text-sm text-emerald-400">{{ user.name }}</span>
                <a href="/auth/logout" class="btn btn-ghost btn-sm text-gray-400 hover:text-gray-200">Logout</a>
            {% else %}
                <a href="/auth/login" class="btn btn-ghost btn-sm text-gray-300 hover:text-emerald-400">Login</a>
            {% endif %}
        </div>
    </div>
    <main class="container mx-auto px-4 py-6 max-w-lg text-gray-200">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
