<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rup-Split{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwindcss.config = {
        theme: {
            fontFamily: {
                sans: ['Inter', 'system-ui', 'sans-serif'],
            },
        }
    }
    </script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="min-h-screen font-sans" style="background: #F6F9FC; color: #1A1F36; -webkit-font-smoothing: antialiased;">
    <div class="navbar px-6" style="background: #FFFFFF; border-bottom: 1px solid #E3E8EE; min-height: 56px;">
        <div class="flex-1">
            <a href="/" class="text-xl font-bold tracking-tight" style="color: #635BFF; text-decoration: none; letter-spacing: -0.02em;">💰 Rup-Split</a>
        </div>
        <div class="flex items-center gap-1">
            {% if user %}
                <a href="/" class="btn btn-ghost btn-sm font-medium" style="color: #697386;">Home</a>
                <a href="/friends" class="btn btn-ghost btn-sm font-medium" style="color: #697386;">Friends</a>
                <a href="/account" class="flex items-center gap-2 mx-2" style="text-decoration: none;">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold" style="background: #635BFF; cursor: pointer;">
                        {{ user.name[0]|upper }}
                    </div>
                </a>
                <a href="/auth/logout" class="btn btn-ghost btn-sm" style="color: #8792A2;">Logout</a>
            {% else %}
                <a href="/auth/login" class="btn btn-ghost btn-sm font-medium" style="color: #697386;">Login</a>
                <a href="/auth/register" class="btn btn-primary btn-sm">Sign Up</a>
            {% endif %}
        </div>
    </div>
    <main class="container mx-auto px-4 py-8 max-w-xl" style="color: #1A1F36;">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
