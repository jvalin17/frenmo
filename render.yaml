services:
  - type: web
    name: frenmo
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
